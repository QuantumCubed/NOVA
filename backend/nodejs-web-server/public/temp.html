<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>MPEG-DASH Video Player</title>
    <script src="https://cdn.dashjs.org/latest/dash.all.min.js"></script>
  </head>

  <body>

    <h1>VIDEO PLAYER TEST: DASH.JS</h1>
    
    <video id="videoPlayer" controls width="640" height="360" autoplay></video>

    <script>
        // MPEG-DASH manifest URL (replace with the actual path to your .mpd file)
        // const manifestUrl = 'https://127.0.0.1:8443/dash/output.mpd';

        const manifestUrl = 'https://127.0.0.1:3000/dash/output.mpd';
        
        // Get the video element
        const video = document.getElementById('videoPlayer');
    
        // Initialize dash.js player
        if (dashjs && dashjs.MediaPlayer) {
          const player = dashjs.MediaPlayer().create();
          player.initialize(video, manifestUrl, true); // true for autoplay
        } else {
          console.error('dash.js library not loaded');
        }
      </script>

      <h2>Upload a File</h2>

      <form action="http://127.0.0.1:3000/upload", method="POST", enctype="multipart/form-data">

        <!-- File input -->
        <label for="file">Select file:</label>
        <input type="file" name="file" id="file" required>
        <br>

        <!-- Metadata inputs -->
        <label for="title">Title:</label>
        <input type="text" name="title" id="title" required>
        <br>

        <label for="description">Description:</label>
        <textarea name="description" id="description"></textarea>
        <br>

        <label for="tags">Tags:</label>
        <input type="text" name="tags" id="tags" placeholder="e.g., holiday, family, nature">
        <br>
        
        <button type="submit">Upload</button>

      </form>

      <br>

      <form action="http://127.0.0.1:3000/search", method="GET">
        <label for="search">Search Video:</label>
        <input type="search" name="search" id="search" placeholder="Type name, user, tag">
        <button type="submit">Search</button>
      </form>

      <br>

      <form action="http://127.0.0.1:3000/user/add" method="POST">

        <!-- Metadata inputs -->
        <label for="first_name">First Name:</label>
        <input type="text" name="first_name" id="first_name" required>
        <br>

        <label for="last_name">Last Name:</label>
        <input type="text" name="last_name" id="last_name" required>
        <br>

        <label for="email">Email:</label>
        <input type="email" name="email" id="email" required>
        <br>

        <label for="password">Password:</label>
        <input type="password" name="password" id="password" required>
        <br>

        <label for="username">Username:</label>
        <input type="text" name="username" id="username" required>
        <br>
        
        <button type="submit">Create Account!</button>

      </form>

      <form action="http://127.0.0.1:3000/auth/login" method="POST">

        <!-- Metadata inputs -->
        <label for="email_log">Email:</label>
        <input type="email" name="email_log" id="email_log" required>
        <br>

        <label for="password_log">Password:</label>
        <input type="password" name="password_log" id="password_log" required>
        <br>
        
        <button type="submit">Login!</button>

      </form>

      <br>

      <form action="http://127.0.0.1:3000/channel/create" method="POST">

        <!-- Metadata inputs -->
        <label for="channel_name">Channel Name:</label>
        <input type="text" name="channel_name" id="channel_name" required>
        <br>

        <label for="channel_description">Channel Description:</label>
        <input type="text" name="channel_description" id="channel_description" placeholder="e.g. gaming channel" required>
        <br>
        
        <button type="submit">Create Channel!</button>

      </form>

      <br>

  </body>

</html>
