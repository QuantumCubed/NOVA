http {

    access_log /var/log/nginx/access.log;

    include /etc/nginx/mime.types;

    gzip on;                           # Enable Gzip compression
    gzip_types application/dash+xml;   # Specify MIME type for .mpd files
    gzip_proxied any;                  # Enable compression for all proxied requests
    gzip_vary on;                      # Add Vary header for proxies
    gzip_min_length 256;               # Minimum length of responses to compress

    # server {
    #     #listen ${HTTP_PORT};
    #     #server_name ${NGINX_HOST};

    #     listen 8080;

    #     location / {
    #         #index index.html;
    #         #root /usr/share/nginx/html;
    #         #try_files $uri /index.html;


    #         proxy_pass https://127.0.0.1:443;  # Forward to HTTPS server block
    #         proxy_set_header Host $host;
    #         proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    #         proxy_set_header X-Forwarded-Proto https;

    #     }
    # }
    
    # HTTP/3 (QUIC)

    server {

        # https://127.0.0.1/dash/output.mpd

        # Optimizations for DASH streaming

        sendfile on;
        tcp_nopush on;
        tcp_nodelay on;

        default_type application/octet-stream;

        listen 8443 quic reuseport;
        listen [::]:8443 quic reuseport;

        quic_retry on;
        ssl_early_data on;

        listen 8443 ssl;
        listen [::]:8443 ssl;
        http2 on;

        # HTTP/3 (QUIC) settings

        # ssl_protocols TLSv1.3;
        # ssl_prefer_server_ciphers off;
        ssl_certificate /etc/nginx/ssl/nginx.crt;
        ssl_certificate_key /etc/nginx/ssl/nginx.key;

        # Define QUIC-related header and protocol settings
        ssl_protocols TLSv1.2 TLSv1.3;
        #ssl_protocols TLSv1.3;
        ssl_prefer_server_ciphers on;
        add_header Alt-Svc 'h3=":8443"; ma=86400'; # HTTP/3-QUIC support
        add_header Cache-Control no-store;

        # Serve MPEG-DASH files

        location /dash {

            alias /dash/out;

            types {
                application/dash+xml mpd;
                video/mp4 mp4;
                application/octet-stream m4s;
            }

            add_header Access-Control-Allow-Origin *;
            add_header Access-Control-Allow-Methods 'GET, HEAD, OPTIONS';
            add_header Access-Control-Allow-Headers 'Range';
        }

    }
    
}